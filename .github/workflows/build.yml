name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Project (Fresh Re-Fetch + Full Extractor)
        run: |
          mkdir -p app/src/main/java/com/assembler/app
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "URLContentAssembler"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.3.2'
          }

          android {
              namespace 'com.assembler.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.assembler.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="URL Assembler"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/assembler/app/MainActivity.java
          package com.assembler.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  webView.clearCache(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new NativeBridge(this), "AndroidBridge");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public static class NativeBridge {
                  private final Context context;

                  NativeBridge(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public String fetchUrl(String targetUrl) {
                      HttpURLConnection conn = null;
                      try {
                          String currentUrl = targetUrl;
                          for (int redirects = 0; redirects < 5; redirects++) {
                              URL url = new URL(currentUrl);
                              conn = (HttpURLConnection) url.openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setUseCaches(false);
                              conn.setDefaultUseCaches(false);
                              conn.setConnectTimeout(20000);
                              conn.setReadTimeout(20000);
                              conn.setRequestMethod("GET");
                              conn.setRequestProperty("User-Agent",
                                  "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.
